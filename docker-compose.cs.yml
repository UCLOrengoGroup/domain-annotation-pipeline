services:
  cath-af-cli:
    platform: linux/amd64
    build: docker/cath-af-cli

  script:
    platform: linux/amd64
    # Build context is the repo root so the image can COPY bin/*.py (pipeline scripts).
    build:
      context: .
      dockerfile: docker/script/Dockerfile

  ted-tools:
    platform: linux/amd64
    build: docker/ted-tools

  foldseek:
    platform: linux/arm64
    build:
      context: https://github.com/steineggerlab/foldseek.git
      dockerfile: ./Dockerfile
      args:
        TARGETARCH: arm64
