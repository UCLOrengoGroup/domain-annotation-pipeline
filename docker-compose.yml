services:

  cath-af-cli:
    image: domain-annotation-pipeline-cath-af-cli
    build: docker/cath-af-cli

  script:
    image: domain-annotation-pipeline-script
    # Build context is the repo root so the image can COPY bin/*.py (pipeline scripts).
    build:
      context: .
      dockerfile: docker/script/Dockerfile

  ted-tools:
    image: domain-annotation-pipeline-ted-tools
    build: docker/ted-tools

  foldseek:
    image: domain-annotation-pipeline-foldseek
    build: docker/foldseek